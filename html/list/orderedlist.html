<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list example</title>
</head>
<body>
    <ol>
    <li>Apple</li>
    <li>Banana</li>
    <li>Grapes</li>
    </ol>
    <hr>
    <ol type = "A">

    <li>Apple</li>
    <li>Banana</li>
    <li>Grapes</li>
    </ol>
<hr>
    <ol type = "I">
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
    </ol>
    <hr>

    <ol type = "i">
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
    </ol>
    <hr>
    <ol type = "1" start = "11" reversed>
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
    </ol>
    <hr>
   
</body>
</html>
