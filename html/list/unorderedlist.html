<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unordered list</title>
</head>
<body>
    <ul type = square>
        <li>sundar</li>
        <li>sharukh</li>
        <li>lalith<li>
        <li>shekar</li>
        <li>dhanush</li>
    </ul>
    <hr>
    <ul type = circle>
        <li>sundar</li>
        <li>sharukh</li>
        <li>lalith<li>
        <li>shekar</li>
        <li>dhanush</li>
    </ul>
    <hr>
    <ul type = disc>
        <li>sundar</li>
        <li>sharukh</li>
        <li>lalith<li>
        <li>shekar</li>
        <li>dhanush</li>
    </ul>
    <hr>

</body>
</html>
