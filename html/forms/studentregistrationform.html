<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student register form</title>
<style>
    select
    
    {
        width: 148px;
    }
 
</style>
<style>
    input[type="date"]
    
    {
        width: 142px;
    }
 
</style>
<style>
    textarea
    
    {
        width: 142px;
        height: 50px;
    }
 
</style>
<style>
    input[name="City"]
    
    {
        width: 142px;
    }
 
</style>


</head>

 
<body>
    <h1 >
        Student form
    </h1>
    <form>
        <table>
            <tr>
                <td><label>Roll No:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>Student's Name</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label>Father's Name</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label>DOB</label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label>Mobile Number</label></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td><label>Email</label></td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td><label>Password</label></td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td><label>Gender</label></td>
                <td><input type="radio" name="Gender">Male
                <input type="radio" name="Gender">Female
            <input type="radio" name="Gender">Others</td>
                
                
            </tr>


             <tr>
                <td><label>Department</label></td>
                <td><input type="checkbox">CSE
                <input type="checkbox">MECH
            <input type="checkbox">AI&ML
        <input type="checkbox">EEE
    <input type="checkbox">ECE</td>
                 
            </tr>


             <tr>
                <td><label>Courses</label></td>
                <td>
                <select>
                    <option>----select option----</option>
                    <option>Java Full Stack</option>
                    <option>Python Full Stack</option>
                    <option>Data Science</option>
                    <option>Mern Stack</option>

                </select>
                </td>
            </tr>

            <tr>
                <td><label>Student Photo</label></td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td><label>City</label></td>
                <td><input type="text" name="City"></td>
            </tr>


            <tr>
                <td><label>Address</label></td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>

            <tr>
                <td align="center" colspan="2" >
                    <br>
                    <br>
                    <input type="submit" value="Register">
                <input type="reset" value="Reset"></td>
                    

            </tr>
            

        </table>
    </form>



</body>
</html>
